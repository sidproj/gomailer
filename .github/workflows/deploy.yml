name: Deploy Gomailer to EC2

on:
  push:
    branches: ["main"]
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
    
    - name: Build Go binary
      run: |
        go build -o server .
    
    - name: Remove previous tmp file
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          rm -rf /home/ubuntu/gomailer/server.tmp

    - name: copy binary to EC2
      uses: appleboy/scp-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "server"
        target: "/home/ubuntu/gomailer/server.tmp"
      
    - name: Deploy binary & restart service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          mv /home/ubuntu/gomailer/server.tmp/server /home/ubuntu/gomailer/server
          chmod +x /home/ubuntu/gomailer/server
          rm -rf /home/ubuntu/gomailer/server.tmp
          sudo systemctl restart gomailer-prod